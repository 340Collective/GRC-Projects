# GRC Projects engineer role through IAM Identity Center.
#
# Stack name: grc-identity-center. Shared stack: only the ISSM deploys it.
#
# One permission set, GRC-Engineer, with the same policies (SecurityAudit,
# ViewOnlyAccess, and the four grc-engineer-* policies) and the same
# grc-permissions-boundary as the GRC-Engineer IAM group in grc-access-model.
# It is assigned in this account to an Identity Center group, and the two
# engineer seats (Automation Engineer and ISSM builder) are Identity Center
# users in that group. They sign in at the AWS access portal (password plus
# MFA, enforced by Identity Center) and use `aws sso login` in the terminal.
# No IAM user, no password handled by the ISSM, and no access key.
#
# grc-require-mfa is not attached on purpose: Identity Center enforces MFA at
# sign-in, and that policy's MFA deny would block every role session.
#
# Depends on stack grc-access-model: the four grc-engineer-* policies and the
# grc-permissions-boundary are referenced by name. Deploy grc-access-model first
# and delete this stack before it. To add or remove a seat, open a PR that edits
# this template.
#
# No passwords, keys, emails, or account IDs here. The instance, user names,
# names, and emails are deploy-time parameters from the private roster; emails
# are NoEcho. AWS emails each user a one-time password at first sign-in
# (Identity Center setting "Send email OTP", turned on once by the ISSM).
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GRC Projects engineer role in IAM Identity Center: GRC-Engineer permission set
  (engineer policies plus grc-permissions-boundary) for two engineer seats.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Identity Center instance
        Parameters:
          - InstanceArn
          - IdentityStoreId
      - Label:
          default: Automation Engineer seat
        Parameters:
          - AutomationEngineerUserName
          - AutomationEngineerGivenName
          - AutomationEngineerFamilyName
          - AutomationEngineerEmail
      - Label:
          default: ISSM builder seat
        Parameters:
          - IssmBuilderUserName
          - IssmBuilderGivenName
          - IssmBuilderFamilyName
          - IssmBuilderEmail

# No defaults: every value comes from the private roster at deploy time.
Parameters:
  InstanceArn:
    Type: String
    Description: IAM Identity Center instance ARN (aws sso-admin list-instances).
    AllowedPattern: "^arn:aws:sso:::instance/ssoins-[a-z0-9]{16}$"
  IdentityStoreId:
    Type: String
    Description: Identity store ID of that instance (d- followed by 10 characters).
    AllowedPattern: "^d-[a-z0-9]{10}$"
  AutomationEngineerUserName:
    Type: String
    Description: Identity Center user name for the Automation Engineer.
    AllowedPattern: "^[A-Za-z0-9+=,._-]{1,64}$"
  AutomationEngineerGivenName:
    Type: String
    Description: First name.
    MinLength: 1
  AutomationEngineerFamilyName:
    Type: String
    Description: Last name.
    MinLength: 1
  AutomationEngineerEmail:
    Type: String
    NoEcho: true
    Description: Email. AWS sends the first sign-in code here.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  IssmBuilderUserName:
    Type: String
    Description: Identity Center user name for the ISSM builder seat.
    AllowedPattern: "^[A-Za-z0-9+=,._-]{1,64}$"
  IssmBuilderGivenName:
    Type: String
    Description: First name.
    MinLength: 1
  IssmBuilderFamilyName:
    Type: String
    Description: Last name.
    MinLength: 1
  IssmBuilderEmail:
    Type: String
    NoEcho: true
    Description: Email. AWS sends the first sign-in code here.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

Resources:
  # The role. Same policies and boundary as the GRC-Engineer IAM group, so an
  # Identity Center seat can do exactly what an IAM engineer seat can, and no more.
  GrcEngineerPermissionSet:
    Type: AWS::SSO::PermissionSet
    Properties:
      InstanceArn: !Ref InstanceArn
      Name: GRC-Engineer
      Description: Same access as the GRC-Engineer IAM group, capped by grc-permissions-boundary.
      SessionDuration: PT8H
      ManagedPolicies:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      CustomerManagedPolicyReferences:
        - Name: grc-engineer-build
          Path: /
        - Name: grc-engineer-security
          Path: /
        - Name: grc-engineer-guardrails
          Path: /
        - Name: grc-engineer-limits
          Path: /
      PermissionsBoundary:
        CustomerManagedPolicyReference:
          Name: grc-permissions-boundary
          Path: /
      Tags:
        - Key: grc-managed-by
          Value: grc-identity-center

  GrcEngineerGroup:
    Type: AWS::IdentityStore::Group
    Properties:
      IdentityStoreId: !Ref IdentityStoreId
      DisplayName: GRC-Engineer
      Description: GRC engineer seats. Gets the GRC-Engineer permission set in this account.

  GrcEngineerAssignment:
    Type: AWS::SSO::Assignment
    Properties:
      InstanceArn: !Ref InstanceArn
      PermissionSetArn: !GetAtt GrcEngineerPermissionSet.PermissionSetArn
      PrincipalType: GROUP
      PrincipalId: !GetAtt GrcEngineerGroup.GroupId
      TargetType: AWS_ACCOUNT
      TargetId: !Ref AWS::AccountId

  GrcAutomationEngineerUser:
    Type: AWS::IdentityStore::User
    Properties:
      IdentityStoreId: !Ref IdentityStoreId
      UserName: !Ref AutomationEngineerUserName
      DisplayName: !Sub "${AutomationEngineerGivenName} ${AutomationEngineerFamilyName}"
      Name:
        GivenName: !Ref AutomationEngineerGivenName
        FamilyName: !Ref AutomationEngineerFamilyName
      Emails:
        - Value: !Ref AutomationEngineerEmail
          Type: work
          Primary: true
      Title: Automation Engineer

  GrcAutomationEngineerMembership:
    Type: AWS::IdentityStore::GroupMembership
    Properties:
      IdentityStoreId: !Ref IdentityStoreId
      GroupId: !GetAtt GrcEngineerGroup.GroupId
      MemberId:
        UserId: !GetAtt GrcAutomationEngineerUser.UserId

  GrcIssmBuilderUser:
    Type: AWS::IdentityStore::User
    Properties:
      IdentityStoreId: !Ref IdentityStoreId
      UserName: !Ref IssmBuilderUserName
      DisplayName: !Sub "${IssmBuilderGivenName} ${IssmBuilderFamilyName}"
      Name:
        GivenName: !Ref IssmBuilderGivenName
        FamilyName: !Ref IssmBuilderFamilyName
      Emails:
        - Value: !Ref IssmBuilderEmail
          Type: work
          Primary: true
      Title: ISSM Builder

  GrcIssmBuilderMembership:
    Type: AWS::IdentityStore::GroupMembership
    Properties:
      IdentityStoreId: !Ref IdentityStoreId
      GroupId: !GetAtt GrcEngineerGroup.GroupId
      MemberId:
        UserId: !GetAtt GrcIssmBuilderUser.UserId

Outputs:
  AccessPortalUrl:
    Description: Where people sign in, and the SSO start URL for `aws configure sso`.
    Value: !Sub "https://${IdentityStoreId}.awsapps.com/start"
  PermissionSetName:
    Description: Role to pick in the access portal and in `aws configure sso`.
    Value: GRC-Engineer
  PermissionSetArn:
    Value: !GetAtt GrcEngineerPermissionSet.PermissionSetArn
  GroupId:
    Value: !GetAtt GrcEngineerGroup.GroupId
  AutomationEngineerUserName:
    Value: !Ref AutomationEngineerUserName
  IssmBuilderUserName:
    Value: !Ref IssmBuilderUserName
