  AdminsGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      GroupName: 'uar-sim-Admins'
      Path: '/uar-sim/'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess'
