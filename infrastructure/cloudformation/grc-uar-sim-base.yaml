AWSTemplateFormatVersion: '2010-09-09'
Description: 'GRC 08 synthetic UAR simulation, base stack: the uar-sim-deny-all-boundary permissions boundary, synthetic customer managed policies, and 14 synthetic groups under /uar-sim/. Every group carries an inline deny-all guard. Effective access is zero. Deploy before the users stacks; delete after them. Temporary: deprecate after the review.'
Metadata:
  UarSimulation:
    Purpose: 'Synthetic user access review population for GRC project 08. Simulation only.'
    Generated: 'Generated by generate_uar_sim.py (seed 20261001). Do not hand-edit; regenerate instead.'
    EffectiveAccess: 'Zero. Every user has the uar-sim-deny-all-boundary permissions boundary, every group has an inline deny-all guard, and no user has a password or access key.'
    Lifecycle: 'Deploy after ISSM approval, run the review, then delete (users stacks first, base last).'
Resources:
  DenyAllBoundary:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'uar-sim-deny-all-boundary'
      Path: '/uar-sim/'
      Description: 'Permissions boundary for every synthetic UAR user. Denies every action.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyEverything'
            Effect: 'Deny'
            Action: '*'
            Resource: '*'
  PaymentsCreatePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'uar-sim-payments-create'
      Path: '/uar-sim/'
      Description: 'Synthetic finance maker access.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'CreatePayments'
            Effect: 'Allow'
            Action:
              - 'dynamodb:PutItem'
              - 'dynamodb:UpdateItem'
            Resource: 'arn:aws:dynamodb:*:*:table/uar-sim-payments'
  PaymentsApprovePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'uar-sim-payments-approve'
      Path: '/uar-sim/'
      Description: 'Synthetic finance checker access.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'ApprovePayments'
            Effect: 'Allow'
            Action:
              - 'dynamodb:UpdateItem'
            Resource: 'arn:aws:dynamodb:*:*:table/uar-sim-payment-approvals'
  DeployPipelinePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'uar-sim-deploy-pipeline'
      Path: '/uar-sim/'
      Description: 'Synthetic deploy access.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'StartPipelines'
            Effect: 'Allow'
            Action:
              - 'codepipeline:StartPipelineExecution'
            Resource: 'arn:aws:codepipeline:*:*:uar-sim-*'
          - Sid: 'StartBuilds'
            Effect: 'Allow'
            Action:
              - 'codebuild:StartBuild'
            Resource: 'arn:aws:codebuild:*:*:project/uar-sim-*'
          - Sid: 'ManageStacks'
            Effect: 'Allow'
            Action:
              - 'cloudformation:CreateStack'
              - 'cloudformation:UpdateStack'
            Resource: 'arn:aws:cloudformation:*:*:stack/uar-sim-*/*'
  ChangeApprovePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'uar-sim-change-approve'
      Path: '/uar-sim/'
      Description: 'Synthetic change approval access.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'ApproveChanges'
            Effect: 'Allow'
            Action:
              - 'codepipeline:PutApprovalResult'
            Resource: 'arn:aws:codepipeline:*:*:uar-sim-*/*/*'
  CreativeAssetsPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'uar-sim-creative-assets-rw'
      Path: '/uar-sim/'
      Description: 'Synthetic creative asset access.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'ListBucket'
            Effect: 'Allow'
            Action:
              - 's3:ListBucket'
            Resource: 'arn:aws:s3:::uar-sim-creative-assets'
          - Sid: 'ReadWriteObjects'
            Effect: 'Allow'
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
            Resource: 'arn:aws:s3:::uar-sim-creative-assets/*'
  MarketingAssetsPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
