# GRC Projects engineer seats.
#
# Stack name: grc-engineer-users. Requires CAPABILITY_NAMED_IAM.
#
# Up to two optional IAM users in the GRC-Engineer group, each with the
# grc-permissions-boundary and the same access as the ISSE engineer user in
# grc-access-model: Automation Engineer and an ISSM builder seat. Each user is
# created only when its user name parameter is set; leave a parameter empty to
# skip that seat.
#
# Depends on stack grc-access-model: the group GRC-Engineer and the managed
# policy grc-permissions-boundary are referenced by literal name (no export).
# MFA is enforced by grc-require-mfa, which grc-access-model attaches to the
# group, so nothing is needed per user. Deploy grc-access-model first and tear
# this stack down before it.
#
# Kept apart from grc-access-model because that template is 49,133 of the
# 51,200 byte inline template limit.
#
# No person names, passwords, access keys, or email addresses are stored here.
# User names are deploy-time parameters. Console logins are created by this
# stack: each seat gets a Secrets Manager secret holding a generated one-time
# password, and the user's LoginProfile reads it through a dynamic reference
# with PasswordResetRequired, so the user picks their own password at first
# sign-in and then enrolls MFA. Engineers cannot read the secret (the engineer
# limits deny secretsmanager:GetSecretValue); the ISSM reads it with
# infrastructure/scripts/grc-engineer-users/4-copy-temp-password.sh and
# delivers it out of band. See infrastructure/scripts/grc-engineer-users/README.md.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GRC Projects engineer seats: up to two optional IAM users in GRC-Engineer
  with the grc-permissions-boundary (Automation Engineer, ISSM builder).
Parameters:
  AutomationEngineerUserName:
    Type: String
    Description: >-
      IAM user name for the Automation Engineer. Placed in GRC-Engineer with the
      grc-permissions-boundary. Leave empty to skip.
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9+=,._-]{1,64}$"
    ConstraintDescription: Empty, or 1 to 64 characters from A-Z, a-z, 0-9, and + = , . _ -
  IssmBuilderUserName:
    Type: String
    Description: >-
      IAM user name for the ISSM builder seat (the ISSM builds with this seat and
      keeps a separate identity for approvals). Placed in GRC-Engineer with the
      grc-permissions-boundary. Leave empty to skip.
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9+=,._-]{1,64}$"
    ConstraintDescription: Empty, or 1 to 64 characters from A-Z, a-z, 0-9, and + = , . _ -
Conditions:
  CreateAutomationEngineer: !Not [!Equals [!Ref AutomationEngineerUserName, ""]]
  CreateIssmBuilder: !Not [!Equals [!Ref IssmBuilderUserName, ""]]
Resources:
  # One-time console passwords, generated by Secrets Manager. 24 characters
  # with upper, lower, number, and symbol meets the account password policy
  # (14 minimum, all four types). The value is only used for first sign-in;
  # PasswordResetRequired makes the user replace it immediately.
  GrcAutomationEngineerInitialPassword:
    Type: AWS::SecretsManager::Secret
    Condition: CreateAutomationEngineer
    Properties:
      Name: !Sub "grc-engineer-users/${AutomationEngineerUserName}/initial-console-password"
      Description: One-time console password for the Automation Engineer seat. Replaced by the user at first sign-in.
      GenerateSecretString:
        PasswordLength: 24
        ExcludeCharacters: "\"'`\\/@ "
        RequireEachIncludedType: true
      Tags:
        - Key: grc-managed-by
          Value: grc-engineer-users
  GrcIssmBuilderInitialPassword:
    Type: AWS::SecretsManager::Secret
    Condition: CreateIssmBuilder
    Properties:
      Name: !Sub "grc-engineer-users/${IssmBuilderUserName}/initial-console-password"
      Description: One-time console password for the ISSM builder seat. Replaced by the user at first sign-in.
      GenerateSecretString:
        PasswordLength: 24
        ExcludeCharacters: "\"'`\\/@ "
        RequireEachIncludedType: true
      Tags:
        - Key: grc-managed-by
          Value: grc-engineer-users
  # Each user matches the GrcEngineerUser in grc-access-model: group
  # GRC-Engineer, the grc-permissions-boundary, no access keys. Unlike that
  # user, the console login is created here from the one-time password above.
  GrcAutomationEngineerUser:
    Type: AWS::IAM::User
    Condition: CreateAutomationEngineer
    Properties:
      UserName: !Ref AutomationEngineerUserName
      LoginProfile:
        Password: !Sub "{{resolve:secretsmanager:${GrcAutomationEngineerInitialPassword}:SecretString}}"
        PasswordResetRequired: true
      Groups:
        - GRC-Engineer
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/grc-permissions-boundary"
      Tags:
        - Key: grc-role
          Value: engineer
        - Key: grc-function
          Value: Automation-Engineer
        - Key: grc-managed-by
          Value: grc-engineer-users

  GrcIssmBuilderUser:
    Type: AWS::IAM::User
    Condition: CreateIssmBuilder
    Properties:
      UserName: !Ref IssmBuilderUserName
      LoginProfile:
        Password: !Sub "{{resolve:secretsmanager:${GrcIssmBuilderInitialPassword}:SecretString}}"
        PasswordResetRequired: true
      Groups:
        - GRC-Engineer
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/grc-permissions-boundary"
      Tags:
        - Key: grc-role
          Value: engineer
        - Key: grc-function
          Value: ISSM-Builder
        - Key: grc-managed-by
          Value: grc-engineer-users

Outputs:
  AutomationEngineerUserName:
    Condition: CreateAutomationEngineer
    Value: !Ref GrcAutomationEngineerUser
  IssmBuilderUserName:
    Condition: CreateIssmBuilder
    Value: !Ref GrcIssmBuilderUser
  AutomationEngineerPasswordSecret:
    Condition: CreateAutomationEngineer
    Description: Secret holding the one-time console password (ISSM reads it; never put the value in git or chat).
    Value: !Ref GrcAutomationEngineerInitialPassword
  IssmBuilderPasswordSecret:
    Condition: CreateIssmBuilder
    Description: Secret holding the one-time console password (ISSM reads it; never put the value in git or chat).
    Value: !Ref GrcIssmBuilderInitialPassword
