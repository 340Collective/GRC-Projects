name: Final report sign-off
description: The partner signs off on a project's final report (accepted, or findings). No code needed.
title: "Final report sign-off: project <NN>"
labels: ["type:acceptance"]
body:
  - type: markdown
    attributes:
      value: |
        On Day 7 the engineer commits FINAL-REPORT.md and the partner commits their results to their own folder. The partner compares them and signs off. Link your results in Findings or in the comment. If the project already has a Final report item in the GRC Program project, comment there instead: "Accepted by: <first name>", or list findings.
        On Jason's projects this is an acceptance test result (pass or findings), never an approval. Final approval stays with Faris, or Adam for Faris-built work.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: ["Foundation", "00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    validations:
      required: true
  - type: dropdown
    id: accepted
    attributes:
      label: Accepted
      options: ["Yes", "Findings"]
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: What failed or is missing in the final report, one per line. Leave blank if accepted. No evidence files or personal data.
  - type: input
    id: by
    attributes:
      label: Accepted by
      description: First name of the partner.
      placeholder: Adam
    validations:
      required: true
