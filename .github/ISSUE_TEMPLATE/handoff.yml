name: Handoff
description: Hand work to the next person (requirements, a build ready for acceptance, or an accepted output). No code needed.
title: "Handoff N: <what>, <from> to <to>"
labels: ["type:handoff"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to post a numbered handoff from your project's LAB-STEPS.md. The document itself lives in GitHub; this issue holds the status and comments.
        If the project already has a handoff issue for this number in the GRC Program project, comment there instead.
  - type: input
    id: from
    attributes:
      label: From
      description: First name of the person sending the handoff.
      placeholder: Adam
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: To
      description: First name of the person receiving it.
      placeholder: Maria
    validations:
      required: true
  - type: dropdown
    id: handoff
    attributes:
      label: Handoff number
      options: ["1", "2", "3", "4"]
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: ["Foundation", "00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is handed over
      description: One or two lines. For example, the control list and test plan for Day 1.
    validations:
      required: true
  - type: input
    id: doc
    attributes:
      label: Link to the GitHub doc
      description: The file or LAB-STEPS section in this repo. Never paste evidence, account IDs, or personal data.
      placeholder: https://github.com/340Collective/GRC-Projects/blob/main/non-engineering/...
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due date
      description: From the project issue (Day 1 requirements, Day 6 acceptance, Day 7 final report).
      placeholder: YYYY-MM-DD
    validations:
      required: true
